services:
  neonspace:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neonspace-dashboard
    restart: unless-stopped
    network_mode: host
    # ICMP, ARP, and /proc/net/arp are used for the 192.168.4.0/24 scan.
    # Docker socket powers monitoring and control; :ro does not restrict API operations.
    # /dev is mounted read-only for SMART drive health via smartctl.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /dev:/dev:ro
      # Persist dashboard name edits in the repository's canonical device matrix.
      - ./public/device-names.json:/app/neonspace-network-dashboard/device-names.json
      # JSON integration credentials live outside the repository and are never served by nginx.
      - ${NEONSPACE_PRIVATE_CONFIG_DIR:-../neonspace-private-config}:/run/neonspace-config:ro
    environment:
      # Compose reads .env for interpolation; map each value explicitly into the container.
      SCAN_INTERVAL_MS: "${SCAN_INTERVAL_MS:-10000}"
      DISCOVERY_INTERVAL_MS: "${DISCOVERY_INTERVAL_MS:-10000}"
      PORT_INTERVAL_MS: "${PORT_INTERVAL_MS:-10000}"
      WAN_INTERVAL_MS: "${WAN_INTERVAL_MS:-10000}"
      SSL_INTERVAL_MS: "${SSL_INTERVAL_MS:-300000}"
      DNS_INTERVAL_MS: "${DNS_INTERVAL_MS:-30000}"
      DOCKER_INTERVAL_MS: "${DOCKER_INTERVAL_MS:-10000}"
      GITHUB_INTERVAL_MS: "${GITHUB_INTERVAL_MS:-60000}"
      SMART_INTERVAL_MS: "${SMART_INTERVAL_MS:-120000}"
      PLEX_INTERVAL_MS: "${PLEX_INTERVAL_MS:-15000}"
      PVE_INTERVAL_MS: "${PVE_INTERVAL_MS:-15000}"
      THROUGHPUT_INTERVAL_MS: "${THROUGHPUT_INTERVAL_MS:-5000}"
      WEATHER_INTERVAL_MS: "${WEATHER_INTERVAL_MS:-600000}"
      PVE_HOST: "${PVE_HOST:-192.168.4.200}"
      PVE_API_TOKEN: "${PVE_API_TOKEN:-}"
      PLEX_HOST: "${PLEX_HOST:-192.168.4.49:32400}"
      PLEX_TOKEN: "${PLEX_TOKEN:-}"
      INTEGRATION_CONFIG_DIR: "/run/neonspace-config"
      DASHBOARD_TOKEN: "${DASHBOARD_TOKEN:-}"
      WOL_MAC: "${WOL_MAC:-}"
      WOL_BROADCAST: "${WOL_BROADCAST:-192.168.4.255}"
      WEATHER_LAT: "${WEATHER_LAT:-}"
      WEATHER_LON: "${WEATHER_LON:-}"
      GITHUB_REPO: "${GITHUB_REPO:-Hemiboy98/neonspace-network-dashboard}"
      SSL_TARGETS: "${SSL_TARGETS:-192.168.4.47:8006,192.168.4.200:8006}"
      DNS_TARGETS: "${DNS_TARGETS:-google.com,cloudflare.com,github.com,plex.tv}"
      DOCKER_SOCKET: "${DOCKER_SOCKET:-/var/run/docker.sock}"
    # Nginx serves the UI on host port 8086; the monitor stays on loopback:8765.
